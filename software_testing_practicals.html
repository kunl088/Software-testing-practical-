<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Testing Practicals</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}
header{padding:18px 16px;border-bottom:1px solid #ddd;background:#fff;position:sticky;top:0;z-index:2}
h1{font-size:21px;margin:0 0 5px} .sub{font-size:13px;color:#666}
main{max-width:900px;margin:0 auto;padding:14px}
#home h2{font-size:18px;margin:4px 0 14px}
.item{display:block;color:#0645ad;text-decoration:underline;padding:9px 2px;border-bottom:1px solid #eee;font-family:Georgia,serif}
#viewer{display:none;background:#111;color:#eee;min-height:calc(100vh - 75px);margin:-14px;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h2{font-size:17px;margin:0;font-weight:600}
button{border:0;border-radius:5px;padding:10px 14px;background:#eee;color:#111;font-weight:600;font-size:14px;cursor:pointer}
#code{white-space:pre;overflow:auto;font:13px/1.55 Consolas,Monaco,monospace;color:#f2f2f2;padding:0 0 24px;tab-size:4}
.back{background:transparent;color:#111;padding:5px 0;margin-bottom:10px}
#viewer .back{color:#ddd} .toast{font-size:12px;color:#9be7a5;min-height:16px}
@media(min-width:700px){main{padding:22px}#viewer{margin:-22px;padding:22px}#code{font-size:14px}}
</style>
</head>
<body>
<header><h1>Software Testing Practicals</h1><div class="sub">Practical 8 to Practical 12</div></header>
<main>
<section id="home"><h2>Select Practical</h2>
<a class="item" href="#" onclick="openPractical(8);return false;">Practical 8 – OrangeHRM Login Automation</a><a class="item" href="#" onclick="openPractical(9);return false;">Practical 9 – Dropdown, Radio Buttons & Checkboxes</a><a class="item" href="#" onclick="openPractical(10);return false;">Practical 10 – Mouse Hover Action</a><a class="item" href="#" onclick="openPractical(11);return false;">Practical 11 – Keyboard Copy & Paste Actions</a><a class="item" href="#" onclick="openPractical(12);return false;">Practical 12 – Drag and Drop</a>
</section>
<section id="viewer">
<button class="back" onclick="goHome()">← Back to practicals</button>
<div class="top"><h2 id="heading"></h2><button onclick="copyCode()">Copy Code</button></div>
<div class="toast" id="toast"></div>
<pre id="code"></pre>
</section>
</main>
<script>
const practicals={"8": "package Selenium_Automation;\n\nimport java.time.Duration;\nimport org.openqa.selenium.By;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.chrome.ChromeDriver;\n\npublic class Selenium_FirstClass {\n    public static void main(String[] args) {\n        // Launch the webdriver and create the object for chrome driver\n        WebDriver driver = new ChromeDriver();\n\n        // Launch the URL\n        driver.get(\"https://opensourcedemo.orangehrmlive.com/web/index.php/auth/login\");\n\n        // maximize the webpage\n        driver.manage().window().maximize();\n\n        // give time to find loactor\n        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(6));\n\n        // Send the value in username field\n        driver.findElement(By.xpath(\"//input[@name=\\\\\"username\\\\\"]\")).sendKeys(\"Admin\");\n\n        // Send the value in password field\n        driver.findElement(By.xpath(\"//input[@name=\\\\\"password\\\\\"]\")).sendKeys(\"admin123\");\n\n        // click on login button\n        driver.findElement(By.xpath(\"//button[text()=' Login ']\")).click();\n\n        //print success message in console\n        System.out.println(\"Script run successfully...\");\n    }\n}", "9": "package firstName_lastName;\n\nimport java.time.Duration;\nimport java.util.List;\nimport org.openqa.selenium.By;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\nimport org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.support.ui.Select;\n\npublic class HandlingDropdown_RadioButton_CheckBox {\n    public static void main(String[] args) throws InterruptedException {\n        WebDriver driver = new ChromeDriver();\n\n        // Initializes a new instance of the ChromeDriver, which is used to control the Chrome browser.\n        driver.get(\"https://testautomationpractice.blogspot.com/\");\n\n        //Opens the specified URL in the browser.\n        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(5));\n\n        //Sets an implicit wait of 5 seconds. This tells the driver to wait for up to 5 seconds for an element to be found before throwing an exception.\n        WebElement dropdown = driver.findElement(By.xpath(\"//select[@id=\\\\\"country\\\\\"]\"));\n\n        //Locates the dropdown element using its XPath.\n        Select obj1 = new Select(dropdown);\n\n        //Creates a Select object, which provides methods specifically for interacting with dropdown menus.\n        obj1.selectByValue(\"brazil\");\n\n        //Selects the dropdown option with the value attribute \"brazil\".\n        //obj1.selectByIndex(2);\n        //obj1.selectByVisibleText(\"Brazil\");\n\n        List<WebElement> options = obj1.getOptions();\n\n        //Retrieves all the options within the dropdown and stores them in a List of WebElements.\n        for (WebElement option : options) {\n            System.out.println(option.getText());\n            // Iterates through the list and prints the text of each option to the console.\n        }\n\n        WebElement radioButton1 = driver.findElement(By.xpath(\"(//input[@name='gender'])[1]\"));\n        //Locates the first radio button using its XPath. The [1] specifies the first element that matches the preceding part of the XPath.\n        WebElement radioButton2 = driver.findElement(By.xpath(\"(//input[@name='gender'])[2]\"));\n        radioButton1.click();\n\n        // Clicks the first radio button.\n        if (radioButton1.isSelected()) {\n            System.out.println(\"First radio button is selected.\");\n            //Checks if the radio button is selected and prints a message if it is.\n        }\n\n        Thread.sleep(2000);\n        //Pauses the execution for 2 seconds. This is often used to observe the automation in action, but is not recommended in production code as it makes tests fragile.\n        radioButton2.click();\n\n        if (radioButton2.isSelected()) {\n            System.out.println(\"Second radio button is selected.\");\n            //Checks if the radio button is selected and prints a message if it is.\n        }\n\n        Thread.sleep(2000);\n\n        WebElement checkbox1 = driver.findElement(By.xpath(\"//input[@id='sunday']\"));\n        //Locates the first checkbox.\n        WebElement checkbox2 = driver.findElement(By.xpath(\"//input[@id='monday']\"));\n        checkbox1.click();\n\n        //Clicks the first checkbox, which selects it.\n        if (checkbox1.isSelected()) {\n            System.out.println(\"First checkbox is selected.\");\n            //Checks if the checkbox is selected and prints a message.\n        }\n\n        Thread.sleep(4000);\n        checkbox1.click();\n        // Deselect....Clicks the checkbox again to deselect it.\n        Thread.sleep(4000);\n        checkbox1.click();\n        // Select.....Clicks it a third time to select it again.\n        Thread.sleep(4000);\n        checkbox2.click();\n        // Select both........Clicks the second checkbox to select it as well.\n\n        if (checkbox1.isSelected() && checkbox2.isSelected()) {\n            System.out.println(\"Both checkboxes are selected.\");\n            //Checks if both checkboxes are selected and prints a confirmation message.\n        }\n    }\n}", "10": "package firstName_lastName;\n\nimport java.time.Duration;\nimport org.openqa.selenium.By;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\nimport org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.interactions.Actions;\n\npublic class MouseHoverAction {\n    public static void main(String[] args) throws InterruptedException {\n        // 1. Setup the WebDriver to use ChromeDriver\n        WebDriver driver = new ChromeDriver();\n\n        // 2. Maximize the browser window for better visibility of elements\n        driver.manage().window().maximize();\n\n        // 3. Navigate to the Flipkart homepage\n        driver.get(\"https://www.flipkart.com/\");\n\n        // 4. Set an implicit wait to handle element loading\n        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\n\n        // 5. Create an instance of the Actions class, passing the WebDriver object\n        // This object is used to build a chain of complex user interactions.\n        Actions actions = new Actions(driver);\n\n        // 6. Find the 'Electronics' menu element using a relative XPath\n        WebElement electronicsMenu = driver.findElement(By.xpath(\"//span[text()='Electronics']\"));\n\n        // 7. Perform a mouse hover action on the 'Electronics' menu\n        // We use moveToElement() to move the mouse cursor to the center of the element.\n        // The .perform() method is crucial as it executes the entire chain of actions.\n        actions.moveToElement(electronicsMenu).perform();\n\n        // A short Thread.sleep is used here to visually demonstrate the hover action\n        Thread.sleep(2000);\n\n        // 8. Close the browser after all actions are completed\n        driver.quit();\n    }\n}", "11": "package firstName_lastName;\n\nimport java.time.Duration;\nimport org.openqa.selenium.By;\nimport org.openqa.selenium.Keys;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.chrome.ChromeDriver;\nimport org.openqa.selenium.interactions.Actions;\n\npublic class Copy_n_Paste {\n    public static void main(String[] args) throws InterruptedException {\n        // Set up driver properties\n        WebDriver driver = new ChromeDriver();\n\n        // Navigate to the specified URL.\n        driver.get(\"https://testautomationpractice.blogspot.com/\");\n\n        // Maximize the browser window for a better view and to ensure elements are visible.\n        driver.manage().window().maximize();\n\n        //Set an implicit wait to handle element loading\n        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(5));\n\n        // Initialize Actions class. This class is used to perform advanced user interactions like keyboard and mouse actions.\n        Actions act = new Actions(driver);\n\n        // Find the name input field and Enter the text \"Gayatri\" into the name field.\n        driver.findElement(By.xpath(\"//input[@id=\\\\\"name\\\\\"]\")).sendKeys(\"Gaytri\");\n        Thread.sleep(2000);\n\n        // Perform a series of keyboard actions:\n        // 1. Send the key combination for \"Select All\" (Ctrl + A).\n        act.keyDown(Keys.ENTER).keyDown(Keys.CONTROL).sendKeys(\"A\").keyUp(Keys.CONTROL).keyUp(Keys.ENTER).perform();\n\n        Thread.sleep(2000);\n\n        // 2. Send the key combination for \"Copy\" (Ctrl + C).\n        act.keyDown(Keys.ENTER).keyDown(Keys.CONTROL).sendKeys(\"A\").sendKeys(\"C\").keyUp(Keys.CONTROL).keyUp(Keys.ENTER).perform();\n\n        // Find the email input field.\n        driver.findElement(By.xpath(\"//input[@id=\\\\\"email\\\\\"]\")).click();\n\n        Thread.sleep(2000);\n        act.keyDown(Keys.ENTER).keyDown(Keys.CONTROL).sendKeys(\"V\").perform();\n\n        Thread.sleep(2000);\n        driver.quit();\n    }\n}", "12": "public class DragAndDropExample {\n    public static void main(String[] args) throws InterruptedException {\n        // Initialize the ChromeDriver\n        WebDriver driver = new ChromeDriver();\n\n        // Navigate to the specified URL\n        driver.get(\"https://testautomationpractice.blogspot.com/\");\n\n        // Maximize the browser window\n        driver.manage().window().maximize();\n\n        // Set an implicit wait to handle element loading\n        driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(5));\n\n        // Create an instance of the Actions class\n        Actions act = new Actions(driver);\n\n        // Locate the draggable element using its XPath\n        WebElement draggableElement = driver.findElement(By.xpath(\"//div[@id='draggable']\"));\n\n        // Introduce a 4-second delay to observe the action\n        Thread.sleep(4000);\n\n        // Locate the droppable element using its XPath\n        WebElement droppableElement = driver.findElement(By.xpath(\"//div[@id='droppable']\"));\n\n        // Perform the drag-and-drop action from the draggable to the droppable element\n        act.dragAndDrop(draggableElement, droppableElement).build().perform();\n\n        // Introduce a 3-second delay to observe the result\n        Thread.sleep(3000);\n\n        // Close the browser\n        driver.quit();\n    }\n}"};
const titles={"8": "OrangeHRM Login Automation", "9": "Dropdown, Radio Buttons & Checkboxes", "10": "Mouse Hover Action", "11": "Keyboard Copy & Paste Actions", "12": "Drag and Drop"};
let current=8;
function openPractical(n){current=n;document.getElementById('home').style.display='none';document.getElementById('viewer').style.display='block';document.getElementById('heading').textContent='Practical '+n+' – '+titles[n];document.getElementById('code').textContent=practicals[n];document.getElementById('toast').textContent='';window.scrollTo(0,0);}
function goHome(){document.getElementById('viewer').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0);}
async function copyCode(){try{await navigator.clipboard.writeText(practicals[current]);document.getElementById('toast').textContent='Code copied!';}catch(e){const t=document.createElement('textarea');t.value=practicals[current];document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();document.getElementById('toast').textContent='Code copied!';}}
</script>
</body>
</html>
